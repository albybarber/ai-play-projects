name: PR comment sentiment

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC, labels the previous UTC day
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to process (YYYY-MM-DD). Blank = yesterday."
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pr-comment-sentiment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pr-comment-sentiment/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Label comments
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The default token can only read this repo; add a fine-grained PAT
          # with read access to pull requests to report on other repos.
          GITHUB_TOKEN: ${{ secrets.SENTIMENT_GITHUB_TOKEN || github.token }}
          REPOS: ${{ vars.SENTIMENT_REPOS || github.repository }}
          DAY: ${{ inputs.day }}
        run: python run_daily.py ${DAY:+--day "$DAY"}
      - uses: actions/upload-artifact@v4
        with:
          name: pr-comment-sentiment-${{ github.run_id }}
          path: pr-comment-sentiment/out/
          retention-days: 90
