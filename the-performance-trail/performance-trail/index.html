<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Performance Trail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════════
       Reset & base
    ═══════════════════════════════════════════════════════════ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:           #2c1810;
      --parchment:    #f5e6c8;
      --parchment-dk: #e8d4a8;
      --ink:          #3d2b1f;
      --ink-light:    #6b4c35;
      --saddle:       #8b4513;
      --golden:       #c17f2a;
      --golden-lt:    #d4952e;
      --rust:         #a0431a;
      --cream:        #fdf6e3;
      --muted:        #9e8a72;
      --success:      #3a6b35;
      --success-lt:   #d4edda;
      --warn:         #7a5c00;
      --warn-lt:      #fff3cd;

      --pixel:        'Press Start 2P', monospace;
      --serif:        Georgia, 'Times New Roman', serif;
      --sans:         system-ui, -apple-system, sans-serif;

      --radius:       4px;
      --shadow:       4px 4px 0 #3d2b1f;
      --shadow-btn:   3px 3px 0 #3d2b1f;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,0.04) 2px,
          rgba(0,0,0,0.04) 4px
        );
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    /* ═══════════════════════════════════════════════════════════
       Layout wrapper
    ═══════════════════════════════════════════════════════════ */
    #app {
      max-width: 820px;
      margin: 0 auto;
    }

    /* ═══════════════════════════════════════════════════════════
       Header / banner
    ═══════════════════════════════════════════════════════════ */
    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .banner {
      font-family: var(--pixel);
      font-size: clamp(10px, 2.5vw, 16px);
      color: var(--golden);
      text-shadow:
        2px 2px 0 #000,
        0  0 20px rgba(193,127,42,0.4);
      letter-spacing: 0.05em;
      line-height: 1.8;
      white-space: pre;
      margin: 0;
    }

    .tagline {
      font-family: var(--pixel);
      font-size: 8px;
      color: var(--muted);
      margin-top: 6px;
      letter-spacing: 0.1em;
    }

    .header-rule {
      border: none;
      border-top: 2px solid var(--golden);
      opacity: 0.4;
      margin: 12px 0 0;
    }

    /* ═══════════════════════════════════════════════════════════
       Screen visibility
    ═══════════════════════════════════════════════════════════ */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    /* ═══════════════════════════════════════════════════════════
       Card / parchment panel
    ═══════════════════════════════════════════════════════════ */
    .panel {
      background: var(--parchment);
      border: 3px solid var(--ink);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 20px;
    }

    .panel-title {
      font-family: var(--pixel);
      font-size: 11px;
      color: var(--saddle);
      letter-spacing: 0.08em;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--parchment-dk);
    }

    .panel-title .rule {
      color: var(--muted);
      font-size: 9px;
    }

    /* ═══════════════════════════════════════════════════════════
       Typography helpers
    ═══════════════════════════════════════════════════════════ */
    h2 {
      font-family: var(--pixel);
      font-size: 13px;
      color: var(--saddle);
      margin-bottom: 14px;
    }

    h3 {
      font-family: var(--pixel);
      font-size: 9px;
      color: var(--ink-light);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    p {
      margin-bottom: 12px;
      line-height: 1.65;
    }

    .label-pixel {
      font-family: var(--pixel);
      font-size: 8px;
      color: var(--ink-light);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    /* ═══════════════════════════════════════════════════════════
       Dividers
    ═══════════════════════════════════════════════════════════ */
    .divider {
      font-family: var(--pixel);
      font-size: 8px;
      color: var(--muted);
      text-align: center;
      margin: 20px 0;
      letter-spacing: 2px;
    }

    .hr-trail {
      border: none;
      border-top: 1px dashed var(--muted);
      margin: 20px 0;
      opacity: 0.6;
    }

    /* ═══════════════════════════════════════════════════════════
       Buttons
    ═══════════════════════════════════════════════════════════ */
    .btn {
      display: inline-block;
      font-family: var(--pixel);
      font-size: 9px;
      padding: 12px 20px;
      border: 2px solid var(--ink);
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: transform 0.07s, box-shadow 0.07s;
      box-shadow: var(--shadow-btn);
      line-height: 1.4;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .btn-primary {
      background: var(--saddle);
      color: var(--parchment);
    }

    .btn-primary:hover {
      background: var(--rust);
    }

    .btn-golden {
      background: var(--golden);
      color: var(--ink);
    }

    .btn-golden:hover {
      background: var(--golden-lt);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
    }

    .btn-ghost:hover {
      background: var(--parchment-dk);
    }

    .btn-sm {
      font-size: 7px;
      padding: 8px 14px;
    }

    .btn-lg {
      font-size: 11px;
      padding: 16px 28px;
    }

    .btn-block {
      display: block;
      width: 100%;
      text-align: center;
    }

    .btn:disabled, .btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 20px;
    }

    .btn-row.right {
      justify-content: flex-end;
    }

    /* ═══════════════════════════════════════════════════════════
       Form elements
    ═══════════════════════════════════════════════════════════ */
    textarea, input[type="text"] {
      width: 100%;
      background: var(--cream);
      border: 2px solid var(--ink-light);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.6;
      padding: 12px 14px;
      resize: vertical;
      transition: border-color 0.15s;
    }

    textarea:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--golden);
      box-shadow: 0 0 0 2px rgba(193,127,42,0.25);
    }

    textarea {
      min-height: 140px;
    }

    .field {
      margin-bottom: 18px;
    }

    /* ═══════════════════════════════════════════════════════════
       Trail event banner
    ═══════════════════════════════════════════════════════════ */
    .trail-event {
      background: var(--ink);
      color: var(--golden);
      font-family: var(--pixel);
      font-size: 8px;
      line-height: 1.8;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    .trail-event::before {
      content: '>> ';
      color: var(--muted);
    }

    /* ═══════════════════════════════════════════════════════════
       Status badges
    ═══════════════════════════════════════════════════════════ */
    .badge {
      display: inline-block;
      font-family: var(--pixel);
      font-size: 7px;
      padding: 4px 8px;
      border-radius: 2px;
      letter-spacing: 0.05em;
      vertical-align: middle;
    }


    /* ═══════════════════════════════════════════════════════════
       Progress bar
    ═══════════════════════════════════════════════════════════ */
    .progress-wrap {
      margin-bottom: 20px;
    }

    .progress-label {
      font-family: var(--pixel);
      font-size: 8px;
      color: var(--ink-light);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .progress-track {
      height: 14px;
      background: var(--parchment-dk);
      border: 2px solid var(--ink);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: repeating-linear-gradient(
        90deg,
        var(--saddle) 0px,
        var(--saddle) 8px,
        var(--rust) 8px,
        var(--rust) 16px
      );
      transition: width 0.4s ease;
    }

    /* ═══════════════════════════════════════════════════════════
       Quote / self-review callout
    ═══════════════════════════════════════════════════════════ */
    .callout {
      background: var(--parchment-dk);
      border-left: 4px solid var(--golden);
      padding: 14px 16px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin-bottom: 16px;
      font-size: 14px;
      font-style: italic;
      color: var(--ink-light);
    }

    .callout-label {
      font-family: var(--pixel);
      font-size: 7px;
      color: var(--muted);
      font-style: normal;
      display: block;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* ═══════════════════════════════════════════════════════════
       Roster list items
    ═══════════════════════════════════════════════════════════ */
    .roster-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .roster-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--cream);
      border: 2px solid var(--parchment-dk);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
    }

    .roster-item:hover {
      border-color: var(--golden);
      background: var(--parchment);
    }

    .roster-item:active {
      transform: translateY(1px);
    }

    .roster-name {
      font-family: var(--pixel);
      font-size: 9px;
      color: var(--ink);
      flex: 1;
    }

    .roster-meta {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ═══════════════════════════════════════════════════════════
       Loading spinner (pixel-art style)
    ═══════════════════════════════════════════════════════════ */
    .loading-wrap {
      text-align: center;
      padding: 40px 20px;
    }

    .loading-pixel {
      font-family: var(--pixel);
      font-size: 10px;
      color: var(--golden);
      animation: blink 1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ═══════════════════════════════════════════════════════════
       Complete / celebration
    ═══════════════════════════════════════════════════════════ */
    .complete-icon {
      font-family: var(--pixel);
      font-size: 14px;
      color: var(--golden);
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 2px 2px 0 #000;
    }

    /* ═══════════════════════════════════════════════════════════
       Scrollable draft preview
    ═══════════════════════════════════════════════════════════ */
    .draft-preview {
      background: var(--cream);
      border: 2px solid var(--ink-light);
      border-radius: var(--radius);
      padding: 16px;
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.7;
      color: var(--ink);
      min-height: 80px;
      white-space: pre-wrap;
    }

    /* ═══════════════════════════════════════════════════════════
       Error state
    ═══════════════════════════════════════════════════════════ */
    .error-box {
      background: #fdf0ef;
      border: 2px solid var(--rust);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--rust);
      font-size: 13px;
      margin-bottom: 16px;
    }

    .error-box .error-label {
      font-family: var(--pixel);
      font-size: 7px;
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    /* ═══════════════════════════════════════════════════════════
       Roster screen additions
    ═══════════════════════════════════════════════════════════ */
    .flavor-text {
      font-size: 14px;
      color: var(--ink-light);
      font-style: italic;
      margin-bottom: 20px;
    }

    .field-label {
      font-family: var(--pixel);
      font-size: 8px;
      color: var(--ink-light);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 8px;
    }

    textarea#roster-input {
      width: 100%;
      min-height: 200px;
      font-family: monospace;
      font-size: 13px;
      background: var(--parchment);
      border: 2px solid var(--saddle);
      border-radius: var(--radius);
      color: var(--ink);
      padding: 14px;
      resize: vertical;
      line-height: 1.6;
    }

    textarea#roster-input:focus {
      outline: none;
      border-color: var(--golden);
      box-shadow: 0 0 0 2px rgba(193,127,42,0.25);
    }

    .error-msg {
      color: var(--rust);
      font-family: var(--pixel);
      font-size: 8px;
      margin-top: 12px;
      line-height: 1.7;
    }

    .btn-secondary {
      background: var(--parchment-dk);
      color: var(--ink);
      border: 2px solid var(--ink-light);
    }

    .btn-secondary:hover {
      background: var(--parchment);
      border-color: var(--saddle);
    }

    .roster-person-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--parchment-dk);
      background: var(--cream);
      border-radius: var(--radius);
      margin-bottom: 8px;
      transition: background 0.12s, border-color 0.12s;
      flex-wrap: wrap;
    }

    .roster-person-row:hover {
      background: var(--parchment);
    }

    .roster-person-row .roster-name {
      font-family: var(--pixel);
      font-size: 9px;
      color: var(--ink);
      flex: 1;
      min-width: 120px;
    }

    .roster-person-row .roster-meta {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .btn-row-right {
      margin-left: auto;
    }

    /* Badge status colors for roster */
    .badge-not-started { background: #666;    color: white; }
    .badge-has-drafts  { background: #8b4513; color: #f5e6c8; }
    .badge-in-progress { background: #c17f2a; color: #2c1810; }
    .badge-done        { background: #2d6a2d; color: white; }

    /* ═══════════════════════════════════════════════════════════
       Responsive adjustments
    ═══════════════════════════════════════════════════════════ */
    @media (max-width: 600px) {
      .panel {
        padding: 18px 16px;
      }

      .btn {
        font-size: 7px;
        padding: 10px 14px;
      }

      .banner {
        font-size: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- ═══════════════════════════════════════════════════════
         Persistent header
    ═══════════════════════════════════════════════════════════ -->
    <header>
      <pre class="banner">THE PERFORMANCE TRAIL</pre>
      <p class="tagline">~ a frontier for honest feedback ~</p>
      <hr class="header-rule" />
    </header>

    <!-- ═══════════════════════════════════════════════════════
         Screen 1: Roster (paste input + person list)
    ═══════════════════════════════════════════════════════════ -->
    <div id="screen-roster" class="screen active">
      <div class="panel">
        <h2 class="panel-title">&#x2B21; FORT ONBOARDING &#x2B21;</h2>
        <p class="flavor-text">The wagon train assembles. Load your roster to begin the trail.</p>

        <!-- Input state (shown initially) -->
        <div id="roster-input-state">
          <label class="field-label" for="roster-input">PASTE YOUR ROSTER</label>
          <textarea id="roster-input" placeholder="Person: Jane Doe&#10;Question: What were your key accomplishments?&#10;Self Review: ...&#10;Manager Reflection:&#10;---"></textarea>
          <div class="btn-row">
            <button id="btn-load-roster" class="btn btn-primary">&#x25B6; LOAD ROSTER</button>
          </div>
          <p id="roster-error" class="error-msg" style="display:none"></p>
        </div>

        <!-- List state (hidden until roster loaded) -->
        <div id="roster-list-state" style="display:none">
          <div id="roster-person-list"></div>
          <div class="btn-row">
            <button id="btn-clear-roster" class="btn btn-secondary">&#x21BA; LOAD NEW ROSTER</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         Screen 2: Landmark (question + notes entry)
    ═══════════════════════════════════════════════════════════ -->
    <div id="screen-landmark" class="screen">
      <p>Loading...</p>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         Screen 3: Campfire (draft review + tone controls)
    ═══════════════════════════════════════════════════════════ -->
    <div id="screen-campfire" class="screen">
      <p>Loading...</p>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         Screen 4: Complete (all questions answered)
    ═══════════════════════════════════════════════════════════ -->
    <div id="screen-complete" class="screen">
      <p>Loading...</p>
    </div>

  </div><!-- /#app -->

  <script>
    /* ═══════════════════════════════════════════════════════════════
       APP STATE
    ═══════════════════════════════════════════════════════════════ */
    const state = {
      roster:               {},   // { personName: [{ question, selfReview, managerReflection }] }
      personList:           [],   // ordered list of person names
      currentPerson:        null,
      currentQuestionIndex: 0,
      answers:              {},   // { personName: { questionIndex: answerString } }
      rawInput:             '',   // the pasted labeled-block text (for localStorage)
    };

    /* ═══════════════════════════════════════════════════════════════
       SCREEN ROUTER
    ═══════════════════════════════════════════════════════════════ */
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      const el = document.getElementById('screen-' + name);
      if (!el) {
        console.error('Unknown screen:', name);
        return;
      }
      el.classList.add('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Stubs — replaced by later steps
    function showLandmarkScreen() { showScreen('landmark'); }
    function showCampfireScreen(draft) { showScreen('campfire'); }
    function showCompleteScreen() { showScreen('complete'); }
    function showRosterScreen() { showScreen('roster'); initRosterScreen(); }

    /* ═══════════════════════════════════════════════════════════════
       LABELED-BLOCK PARSER
    ═══════════════════════════════════════════════════════════════ */

    /**
     * Extract named fields from a single block of text.
     *
     * Labels supported (case-insensitive):
     *   Person | Question | Self Review | Manager Reflection
     *
     * A field's value is everything from after "Label:" to just before
     * the next label line, or end of block. Multi-line values are kept.
     *
     * @param {string} block
     * @returns {{ person?, question?, selfReview?, managerReflection? }}
     */
    function extractFields(block) {
      const LABELS = ['Person', 'Question', 'Self Review', 'Manager Reflection'];
      const labelPattern = new RegExp(`^(${LABELS.join('|')}):(.*)$`, 'i');

      const keyMap = {
        person:             'person',
        question:           'question',
        selfreview:         'selfReview',
        managerreflection:  'managerReflection',
      };

      const lines = block.split('\n');
      const fields = {};
      let currentKey = null;
      let currentValue = [];

      function saveField() {
        if (currentKey === null) return;
        const normalized = currentKey.toLowerCase().replace(/ /g, '');
        const mappedKey = keyMap[normalized];
        if (mappedKey) {
          fields[mappedKey] = currentValue.join('\n').trim();
        }
      }

      for (const line of lines) {
        const match = line.match(labelPattern);
        if (match) {
          saveField();
          currentKey   = match[1];
          currentValue = [match[2]]; // text on the same line as the label
        } else if (currentKey !== null) {
          currentValue.push(line);
        }
        // lines before any label are silently ignored
      }
      saveField();

      return fields;
    }

    /**
     * Parse the full labeled-block input text into a roster.
     *
     * Blocks are separated by lines containing only "---".
     * A `Person:` field carries forward to subsequent blocks if omitted.
     *
     * @param {string} text
     * @returns {{ roster: Object, personList: string[] }}
     */
    function parseRoster(text) {
      const blocks = text.split(/^---\s*$/m).map(b => b.trim()).filter(b => b);
      const roster = {};
      const personList = [];
      let currentPerson = null;

      for (const block of blocks) {
        const fields = extractFields(block);

        if (fields.person) {
          currentPerson = fields.person.trim();
          if (!roster[currentPerson]) {
            roster[currentPerson] = [];
            personList.push(currentPerson);
          }
        }

        // Skip malformed blocks
        if (!currentPerson || !fields.question) continue;

        roster[currentPerson].push({
          question:           fields.question.trim(),
          selfReview:         (fields.selfReview         || '').trim(),
          managerReflection:  (fields.managerReflection  || '').trim(),
        });
      }

      return { roster, personList };
    }

    /* ═══════════════════════════════════════════════════════════════
       TRAIL EVENTS
    ═══════════════════════════════════════════════════════════════ */
    const TRAIL_EVENTS = [
      "Your wagon fords the Monday Standup River. No losses.",
      "A wild Slack Notification appears! You ignore it and press on.",
      "One of your oxen (a summer intern) has come down with mild Scope Creep. It should pass.",
      "You spot a Herd of Distractions on the horizon. You keep the wagon steady.",
      "A trader offers you three Post-it Notes for your undivided attention. You accept.",
      "You successfully cross the Q3 OKRs River! No wagons lost.",
      "The trail forks. You take the path marked 'Constructive Feedback.'",
      "Your wagon wheel (calendar) nearly breaks under the weight of back-to-back meetings.",
      "You find an abandoned wagon labeled 'Last Year's Review Template.' You take what's useful.",
      "A sudden hailstorm of Reply-All emails passes overhead. You take cover briefly.",
    ];

    function randomTrailEvent() {
      return TRAIL_EVENTS[Math.floor(Math.random() * TRAIL_EVENTS.length)];
    }

    /* ═══════════════════════════════════════════════════════════════
       STATUS HELPERS
    ═══════════════════════════════════════════════════════════════ */

    /**
     * Determine a person's review status.
     * @param {string} personName
     * @returns {'not-started' | 'has-drafts' | 'in-progress' | 'done'}
     */
    function getPersonStatus(personName) {
      const questions = state.roster[personName] || [];
      const answers   = state.answers[personName] || {};

      const answeredCount        = Object.keys(answers).length;
      const hasPreExistingDrafts = questions.some(q => q.managerReflection);

      if (answeredCount === 0 && !hasPreExistingDrafts) return 'not-started';
      if (answeredCount === questions.length)           return 'done';
      if (hasPreExistingDrafts && answeredCount === 0)  return 'has-drafts';
      return 'in-progress';
    }

    /**
     * Return a badge element for a person's status.
     * @param {string} status
     * @returns {HTMLElement}
     */
    function makeBadge(status) {
      const el = document.createElement('span');
      el.className = 'badge';
      switch (status) {
        case 'done':
          el.classList.add('badge-done');
          el.textContent = 'DONE';
          break;
        case 'in-progress':
          el.classList.add('badge-in-progress');
          el.textContent = 'IN PROGRESS';
          break;
        case 'has-drafts':
          el.classList.add('badge-has-drafts');
          el.textContent = 'HAS DRAFTS';
          break;
        default:
          el.classList.add('badge-not-started');
          el.textContent = 'NOT STARTED';
      }
      return el;
    }

    /* ═══════════════════════════════════════════════════════════════
       API HELPER
    ═══════════════════════════════════════════════════════════════ */

    /**
     * Call the /api/draft endpoint.
     * @param {{ question, self_review, notes, previous_draft?, tone_instruction? }} payload
     * @returns {Promise<string>} the draft text
     */
    async function callDraftAPI(payload) {
      const resp = await fetch('/api/draft', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'API error');
      return data.draft;
    }

    /* ═══════════════════════════════════════════════════════════════
       ANSWER STORAGE
    ═══════════════════════════════════════════════════════════════ */

    /**
     * Save a manager's drafted answer into state.
     * localStorage persistence is added in Step 9.
     * @param {string} personName
     * @param {number} questionIndex
     * @param {string} answer
     */
    function saveAnswer(personName, questionIndex, answer) {
      if (!state.answers[personName]) {
        state.answers[personName] = {};
      }
      state.answers[personName][questionIndex] = answer;
    }

    /* ═══════════════════════════════════════════════════════════════
       NAVIGATION HELPERS
    ═══════════════════════════════════════════════════════════════ */

    /**
     * Begin reviewing a specific person, starting at question 0.
     * @param {string} personName
     */
    function startPerson(personName) {
      state.currentPerson        = personName;
      state.currentQuestionIndex = 0;
      showLandmarkScreen();
    }

    /**
     * Move to the next question for the current person.
     * Navigates to complete screen when all questions are answered.
     */
    function advanceQuestion() {
      const questions = state.roster[state.currentPerson];
      state.currentQuestionIndex++;
      if (state.currentQuestionIndex >= questions.length) {
        showCompleteScreen();
      } else {
        showLandmarkScreen();
      }
    }

    /* ═══════════════════════════════════════════════════════════════
       UI UTILITIES
    ═══════════════════════════════════════════════════════════════ */

    /**
     * Create a progress bar element.
     * @param {number} current  0-based answered count
     * @param {number} total
     * @param {string} [label]
     * @returns {HTMLElement}
     */
    function makeProgressBar(current, total, label) {
      const pct  = total === 0 ? 0 : Math.round((current / total) * 100);
      const wrap = document.createElement('div');
      wrap.className = 'progress-wrap';
      wrap.innerHTML = `
        <div class="progress-label">
          <span>${label || 'Progress'}</span>
          <span>${current} / ${total}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width: ${pct}%"></div>
        </div>
      `;
      return wrap;
    }

    /**
     * Show a trail event banner inside a given container element.
     * @param {HTMLElement} container
     */
    function appendTrailEvent(container) {
      const div = document.createElement('div');
      div.className = 'trail-event';
      div.textContent = randomTrailEvent();
      container.appendChild(div);
    }

    /**
     * Render an error message box.
     * @param {string} message
     * @returns {HTMLElement}
     */
    function makeErrorBox(message) {
      const div = document.createElement('div');
      div.className = 'error-box';
      div.innerHTML = `<span class="error-label">Trail Trouble</span>${escapeHtml(message)}`;
      return div;
    }

    /**
     * Minimal HTML escaping for safe text insertion.
     * @param {string} str
     * @returns {string}
     */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ═══════════════════════════════════════════════════════════════
       ROSTER SCREEN
    ═══════════════════════════════════════════════════════════════ */

    /**
     * Show an error message below the load button.
     * @param {string} msg
     */
    function showRosterError(msg) {
      const el = document.getElementById('roster-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideRosterError() {
      const el = document.getElementById('roster-error');
      el.style.display = 'none';
      el.textContent = '';
    }

    /**
     * Rebuild the person list and switch to list state.
     */
    function renderRosterList() {
      const listContainer = document.getElementById('roster-person-list');
      listContainer.innerHTML = '';

      for (const personName of state.personList) {
        const questions  = state.roster[personName] || [];
        const status     = getPersonStatus(personName);

        const row = document.createElement('div');
        row.className = 'roster-person-row';

        // Name
        const nameEl = document.createElement('span');
        nameEl.className = 'roster-name';
        nameEl.textContent = personName;
        row.appendChild(nameEl);

        // Badge
        const badge = makeBadge(status);
        row.appendChild(badge);

        // Question count
        const metaEl = document.createElement('span');
        metaEl.className = 'roster-meta';
        metaEl.textContent = questions.length + ' question' + (questions.length !== 1 ? 's' : '');
        row.appendChild(metaEl);

        // Action button — label depends on status
        let btnLabel;
        if (status === 'done') {
          btnLabel = '▶ VIEW RESULTS';
        } else if (status === 'in-progress' || status === 'has-drafts') {
          btnLabel = '▶ CONTINUE';
        } else {
          btnLabel = '▶ START REVIEW';
        }

        const btn = document.createElement('button');
        btn.className = 'btn btn-primary btn-sm btn-row-right';
        btn.textContent = btnLabel;
        // Capture personName in closure
        btn.addEventListener('click', (function(name) {
          return function() { startPerson(name); };
        })(personName));
        row.appendChild(btn);

        listContainer.appendChild(row);
      }

      // Switch visibility
      document.getElementById('roster-input-state').style.display = 'none';
      document.getElementById('roster-list-state').style.display  = 'block';
    }

    /**
     * Wire up the roster screen. Called each time the screen becomes visible.
     */
    function initRosterScreen() {
      // If roster is already loaded, show the list immediately
      if (state.personList.length > 0) {
        renderRosterList();
      } else {
        document.getElementById('roster-input-state').style.display = 'block';
        document.getElementById('roster-list-state').style.display  = 'none';
        hideRosterError();
      }
    }

    // Wire up "Load Roster" button (once, at page load)
    document.getElementById('btn-load-roster').addEventListener('click', function() {
      const text = document.getElementById('roster-input').value.trim();
      hideRosterError();
      if (!text) {
        showRosterError('Please paste your roster text above.');
        return;
      }
      try {
        const { roster, personList } = parseRoster(text);
        if (personList.length === 0) {
          showRosterError('No people found. Check the format: Person: / Question: / Self Review: / Manager Reflection: separated by ---');
          return;
        }
        state.roster     = roster;
        state.personList = personList;
        state.rawInput   = text;
        renderRosterList();
      } catch (e) {
        showRosterError('Parse error: ' + e.message);
      }
    });

    // Wire up "Load New Roster" button (once, at page load)
    document.getElementById('btn-clear-roster').addEventListener('click', function() {
      state.roster     = {};
      state.personList = [];
      state.rawInput   = '';
      state.answers    = {};
      document.getElementById('roster-input').value = '';
      document.getElementById('roster-list-state').style.display  = 'none';
      document.getElementById('roster-input-state').style.display = 'block';
      hideRosterError();
    });

    /* ═══════════════════════════════════════════════════════════════
       INIT — Steps 4-9 will populate the individual screens.
       For now, the shell is in place and the router is wired.
    ═══════════════════════════════════════════════════════════════ */
    (function init() {
      // Screen router is ready; state machine is initialized.
      // Individual screen builders will be attached by subsequent steps.
      console.log('[Performance Trail] Shell initialized. Screens: roster, landmark, campfire, complete.');
      initRosterScreen();
    })();
  </script>
</body>
</html>
